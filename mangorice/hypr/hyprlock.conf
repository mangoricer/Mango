
general {
    hide_cursor = true
    grace = 1
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.012
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.15
}

label {
    monitor =
    text = Locked
    color = rgba(205, 214, 244, 0.95)
    font_size = 48
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1          # полностью круглые точки
    outer_color = rgba(137, 180, 250, 0.85)
    inner_color = rgba(30, 30, 46, 0.65)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    fade_timeout = 800
    placeholder_text = <i>Password</i>
    hide_input = false
    rounding = 18               # сильное скругление поля
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}   
